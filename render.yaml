# render.yaml — Render deployment blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: legacy-locker-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false        # set to your Vercel URL e.g. https://legacy-locker.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false        # paste full serviceAccount.json as a single-line JSON string
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
